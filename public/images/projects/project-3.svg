<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Architectural Building Outline / Isometric Profile -->
  <g stroke="#C59B27" stroke-width="2.5" fill="none" opacity="0.6" transform="translate(100, 80)">
    <!-- Base Slab -->
    <path d="M 200 520 L 800 520 L 720 570 L 120 570 Z" fill="rgba(197, 155, 39, 0.08)"/>
    <!-- Ground Floor -->
    <rect x="220" y="320" width="560" height="200" fill="rgba(16, 24, 38, 0.7)"/>
    <!-- Upper Floor Cantilever -->
    <rect x="180" y="160" width="640" height="160" fill="rgba(21, 32, 51, 0.8)"/>
    <!-- Windows & Louvers -->
    <line x1="260" y1="200" x2="480" y2="200" stroke="#C59B27" stroke-width="4"/>
    <line x1="260" y1="240" x2="480" y2="240" stroke="#C59B27" stroke-width="2"/>
    <line x1="260" y1="280" x2="480" y2="280" stroke="#C59B27" stroke-width="2"/>
    <rect x="540" y="200" width="240" height="90" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <rect x="260" y="360" width="180" height="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <rect x="520" y="360" width="220" height="160" stroke="#C59B27" stroke-width="2"/>
    <!-- Roof Canopy -->
    <line x1="140" y1="140" x2="860" y2="140" stroke="#C59B27" stroke-width="6"/>
  </g>

  <!-- Typography Overlay -->
  <rect x="60" y="620" width="1080" height="120" rx="10" fill="rgba(11, 17, 30, 0.85)" stroke="rgba(255,255,255,0.08)"/>
  <text x="100" y="670" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">RCC Structural Frame & Slab Casting</text>
  <text x="100" y="705" font-family="'Inter', sans-serif" font-weight="500" font-size="16" fill="#C59B27">Bilaspur, Chhattisgarh • SK Construction (Chhattisgarh)</text>
</svg>